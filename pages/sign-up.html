<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <title>Signup</title>
</head>
<body>
    

<div class="container mt-5">
<div class="row justify-content-center">
    <div class="col-md-8 form-shadow">
        <form class="py-5 px-4 text-center txt-color">
            <h1 class="my-4">Smart Login System</h1>
            <input class="form-control bg-main my-2" placeholder="Enter your name" type="text">
            <input class="form-control bg-main my-2" placeholder="Enter your email" type="text">
            <input class="form-control bg-main my-3" placeholder="Enter your password" type="text">
            <button class="submit-btn">Log Up</button>
            <p class="text-white mt-2 question">Don’t have an account? <a href="../index.html" class="Link">Sign In</a></p>
        </form>
    </div>
</div>
</div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/main.js"></script>
</body>
</html>
